<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <title>FitCoach — Muscle Recovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f4f6fa;
      --text-secondary: #9aa8bc;
      --text-muted: #6b7a90;
      --glass: rgba(16, 22, 32, 0.55);
      --glass-border: rgba(255, 255, 255, 0.09);
      --green: #34d399;
      --red: #f87171;
      --blue: #60a5fa;
      --accent: #fb923c;
      --sidebar-w: min(360px, 92vw);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #05070c;
      font-family: "Inter", system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr var(--sidebar-w);
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(8, 12, 18, 0.85);
      backdrop-filter: blur(12px);
      z-index: 5;
    }

    .brand { display: flex; align-items: center; gap: 0.65rem; }

    .brand-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--green), #059669);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      box-shadow: 0 0 18px rgba(52, 211, 153, 0.35);
    }

    .brand h1 { font-size: 0.95rem; font-weight: 700; }
    .brand p { font-size: 0.68rem; color: var(--text-muted); }

    .topbar-nav { display: flex; gap: 0.5rem; }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.45rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      font-family: inherit;
    }

    .nav-btn:hover { color: var(--text); }

    .stage-wrap {
      position: relative;
      min-height: 0;
      touch-action: none;
      cursor: grab;
      overflow: hidden;
      background: #02040a;
    }

    .stage-wrap:active { cursor: grabbing; }

    .stage-fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stage-fx-nebula {
      background:
        radial-gradient(ellipse 55% 40% at 18% 22%, rgba(56, 189, 248, 0.14), transparent 60%),
        radial-gradient(ellipse 45% 35% at 82% 18%, rgba(251, 146, 60, 0.1), transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 85%, rgba(16, 185, 129, 0.08), transparent 60%);
      animation: nebula-drift 28s ease-in-out infinite alternate;
    }

    .stage-fx-grid {
      background-image:
        linear-gradient(rgba(96, 165, 250, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96, 165, 250, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.45), transparent 55%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.45), transparent 55%);
      transform: perspective(420px) rotateX(58deg) scale(1.6);
      transform-origin: center bottom;
      opacity: 0.55;
      animation: grid-pulse 6s ease-in-out infinite;
    }

    .stage-fx-horizon {
      background:
        linear-gradient(to top, rgba(56, 189, 248, 0.2), transparent 42%),
        radial-gradient(ellipse 80% 28% at 50% 100%, rgba(52, 211, 153, 0.16), transparent 70%);
    }

    .stage-fx-vignette {
      background: radial-gradient(ellipse 70% 65% at 50% 42%, transparent 35%, rgba(2, 4, 10, 0.78) 100%);
    }

    @keyframes nebula-drift {
      from { transform: scale(1); }
      to { transform: scale(1.06) translate(-1%, 1%); }
    }

    @keyframes grid-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.65; }
    }

    #mannequin-scene {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
    }

    .stage-hint {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      pointer-events: none;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(8, 12, 18, 0.55);
      border: 1px solid rgba(96, 165, 250, 0.18);
    }

    .sidebar {
      border-left: 1px solid var(--glass-border);
      background: rgba(10, 14, 21, 0.92);
      backdrop-filter: blur(20px);
      padding: 1.25rem 1.1rem;
      overflow-y: auto;
      min-height: 0;
    }

    .sidebar h2 {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .sidebar-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.45;
    }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    .legend-item {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 0.55rem 0.5rem;
      text-align: center;
    }

    .legend-item b { display: block; font-size: 0.78rem; font-weight: 800; margin-bottom: 0.15rem; }
    .legend-item span {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .muscle-list { list-style: none; }

    .muscle-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.55rem 0.35rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.82rem;
      border-radius: 8px;
      cursor: pointer;
    }

    .muscle-list li:last-child { border-bottom: none; }
    .muscle-list li:hover { background: rgba(255,255,255,0.03); }
    .muscle-list li.is-hit { background: rgba(255,255,255,0.06); }

    .muscle-list li > span:last-child {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.08rem;
    }

    .mp-rate { font-weight: 800; }
    .mp-time { font-size: 0.7rem; color: var(--text-muted); }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #05070c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .loading-overlay.hide { opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }

    .loader {
      width: 36px; height: 36px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .zone-green { color: var(--green); }
    .zone-orange { color: var(--accent); }
    .zone-red { color: var(--red); }
    .zone-unknown, .zone-muted { color: var(--text-muted); }

    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        overflow: auto;
      }
      html, body { overflow: auto; }
      .sidebar {
        border-left: none;
        border-top: 1px solid var(--glass-border);
        max-height: 42vh;
      }
      .stage-wrap { min-height: 55vh; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="loader"></div>
    <p>Loading semi-realistic mannequin…</p>
  </div>

  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🧍</div>
        <div>
          <h1>Muscle Recovery</h1>
          <p>3D · option 3 semi-realistic</p>
        </div>
      </div>
      <nav class="topbar-nav">
        <a class="nav-btn" href="/">◱ Classic</a>
        <a class="nav-btn" href="/immersive">✦ Orbit</a>
      </nav>
    </header>

    <div class="stage-wrap" id="stage-wrap">
      <div class="stage-fx stage-fx-nebula"></div>
      <div class="stage-fx stage-fx-grid"></div>
      <div class="stage-fx stage-fx-horizon"></div>
      <div class="stage-fx stage-fx-vignette"></div>
      <canvas id="mannequin-scene"></canvas>
      <p class="stage-hint">Drag to rotate · tap list to focus</p>
    </div>

    <aside class="sidebar">
      <h2>Recovery by muscle</h2>
      <p class="sidebar-sub" id="muscle-panel-sub">From Jefit history</p>
      <div class="legend">
        <div class="legend-item"><b class="zone-green">100%</b><span>Ready</span></div>
        <div class="legend-item"><b class="zone-orange">80–99%</b><span>Almost</span></div>
        <div class="legend-item"><b class="zone-red">1–79%</b><span>Repairing</span></div>
      </div>
      <ul class="muscle-list" id="muscle-panel-list"></ul>
    </aside>
  </div>

  <script type="module">
    import * as THREE from "three";

    const $ = (s) => document.querySelector(s);

    const ZONE_RGB = {
      green: [52, 211, 153],
      orange: [251, 146, 60],
      red: [248, 113, 113],
      muted: [75, 85, 104],
      unknown: [75, 85, 104],
    };

    // Approximate muscle regions on front/back textures (normalized 0–1)
    const FRONT_REGIONS = {
      shoulders: [
        [0.18, 0.18, 0.28, 0.12],
        [0.54, 0.18, 0.28, 0.12],
      ],
      chest: [[0.32, 0.24, 0.36, 0.12]],
      abs: [[0.38, 0.36, 0.24, 0.16]],
      biceps: [
        [0.14, 0.28, 0.14, 0.12],
        [0.72, 0.28, 0.14, 0.12],
      ],
      forearms: [
        [0.10, 0.40, 0.14, 0.14],
        [0.76, 0.40, 0.14, 0.14],
      ],
      upper_leg: [
        [0.30, 0.54, 0.18, 0.18],
        [0.52, 0.54, 0.18, 0.18],
      ],
      lower_leg: [
        [0.32, 0.74, 0.14, 0.16],
        [0.54, 0.74, 0.14, 0.16],
      ],
    };

    const BACK_REGIONS = {
      shoulders: [
        [0.18, 0.16, 0.26, 0.12],
        [0.56, 0.16, 0.26, 0.12],
        [0.36, 0.14, 0.28, 0.08],
      ],
      back: [[0.28, 0.24, 0.44, 0.22]],
      triceps: [
        [0.12, 0.28, 0.14, 0.14],
        [0.74, 0.28, 0.14, 0.14],
      ],
      forearms: [
        [0.10, 0.42, 0.14, 0.14],
        [0.76, 0.42, 0.14, 0.14],
      ],
      glutes: [
        [0.34, 0.50, 0.15, 0.10],
        [0.51, 0.50, 0.15, 0.10],
      ],
      upper_leg: [
        [0.30, 0.58, 0.18, 0.16],
        [0.52, 0.58, 0.18, 0.16],
      ],
      lower_leg: [
        [0.32, 0.76, 0.14, 0.14],
        [0.54, 0.76, 0.14, 0.14],
      ],
    };

    const canvas = $("#mannequin-scene");
    const stage = $("#stage-wrap");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040a, 0.06);

    const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 40);
    camera.position.set(0, 0.15, 3.4);
    camera.lookAt(0, 0.05, 0);

    scene.add(new THREE.HemisphereLight(0xc7d4e8, 0x0a121c, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(2, 3, 3);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x38bdf8, 0.35);
    fill.position.set(-2, 1, -1);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xfb923c, 0.25);
    rim.position.set(0, 1.2, -2.5);
    scene.add(rim);

    // Stars
    const starPos = new Float32Array(700 * 3);
    for (let i = 0; i < 700; i++) {
      const r = 12 + Math.random() * 28;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.5 + 2;
      starPos[i * 3 + 2] = r * Math.cos(phi) - 6;
    }
    const starsGeo = new THREE.BufferGeometry();
    starsGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(
      starsGeo,
      new THREE.PointsMaterial({ color: 0xc8d8f0, size: 0.04, transparent: true, opacity: 0.8, depthWrite: false })
    );
    scene.add(stars);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(0.9, 48),
      new THREE.MeshStandardMaterial({
        color: 0x0c1520,
        emissive: 0x0ea5e9,
        emissiveIntensity: 0.12,
        metalness: 0.5,
        roughness: 0.35,
        transparent: true,
        opacity: 0.8,
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.15;
    scene.add(floor);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.92, 0.97, 64),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -1.145;
    scene.add(ring);

    const mannequin = new THREE.Group();
    scene.add(mannequin);

    let frontTex = null;
    let backTex = null;
    let frontMat = null;
    let backMat = null;
    let focusKey = null;
    let muscleData = [];
    let liveTimer = null;
    let rotY = 0.25;
    let dragging = false;
    let lastX = 0;
    let moved = 0;
    const clock = new THREE.Clock();

    function zoneClass(zone) {
      return zone === "orange" ? "zone-orange" : `zone-${zone || "unknown"}`;
    }

    function zoneForRate(rate, hasTraining) {
      if (!hasTraining && rate === 100) return "green";
      if (rate >= 100) return "green";
      if (rate >= 80) return "orange";
      if (rate >= 1) return "red";
      return "muted";
    }

    function formatRemaining(remainingMin) {
      if (!remainingMin || remainingMin <= 0) return "—";
      if (remainingMin < 60) return `${remainingMin}m`;
      const h = Math.floor(remainingMin / 60);
      const m = remainingMin % 60;
      return m ? `${h}h ${m}m` : `${h}h`;
    }

    function liveMuscleSnapshot(m, nowMs) {
      const windowH = Number(m.recovery_hours);
      let speed = Number(m.speed_multiplier);
      if (!Number.isFinite(speed) || speed <= 0) speed = 1;
      speed = Math.min(1.35, Math.max(0.65, speed));
      const lastMs = m.last_trained_ms != null ? Number(m.last_trained_ms) : (m.last_trained ? Date.parse(m.last_trained) : null);
      const hasTraining = lastMs != null && Number.isFinite(lastMs);
      if (!hasTraining || !Number.isFinite(windowH) || windowH <= 0) {
        return { ...m, rate: 100, remaining_min: 0, remaining_label: "—", zone: "green" };
      }
      const elapsedH = Math.max(0, (nowMs - lastMs) / 3600000);
      let rate = Math.round(Math.max(0, Math.min(100, 100 * (elapsedH * speed) / windowH)));
      let remainingH = Math.max(0, windowH / speed - elapsedH);
      let remainingMin = remainingH > 0 ? Math.round(remainingH * 60) : 0;
      if (rate >= 100) { rate = 100; remainingMin = 0; }
      return {
        ...m,
        rate,
        remaining_min: remainingMin,
        remaining_label: formatRemaining(rate < 100 ? remainingMin : 0),
        zone: zoneForRate(rate, hasTraining),
      };
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function paintRegions(ctx, w, h, regions, byKey, boostKey) {
      Object.entries(regions).forEach(([key, rects]) => {
        const row = byKey[key];
        const zone = (row && row.zone) || "green";
        const [r, g, b] = ZONE_RGB[zone] || ZONE_RGB.unknown;
        const alpha = key === boostKey ? 0.72 : 0.55;
        ctx.save();
        ctx.globalCompositeOperation = "color";
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        rects.forEach(([x, y, rw, rh]) => {
          const px = x * w;
          const py = y * h;
          const pw = rw * w;
          const ph = rh * h;
          ctx.beginPath();
          ctx.ellipse(px + pw / 2, py + ph / 2, pw / 2, ph / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();

        // Soft lift so colors read on greyscale anatomy
        ctx.save();
        ctx.globalCompositeOperation = "soft-light";
        ctx.fillStyle = `rgba(${r},${g},${b},${key === boostKey ? 0.45 : 0.28})`;
        rects.forEach(([x, y, rw, rh]) => {
          const px = x * w;
          const py = y * h;
          const pw = rw * w;
          const ph = rh * h;
          ctx.beginPath();
          ctx.ellipse(px + pw / 2, py + ph / 2, pw / 2, ph / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      });
    }

    function makeTintedTexture(baseImg, regions, byKey, boostKey) {
      const c = document.createElement("canvas");
      c.width = baseImg.naturalWidth || 768;
      c.height = baseImg.naturalHeight || 1024;
      const ctx = c.getContext("2d");
      ctx.drawImage(baseImg, 0, 0, c.width, c.height);
      paintRegions(ctx, c.width, c.height, regions, byKey, boostKey);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      tex.needsUpdate = true;
      return tex;
    }

    function applyRecoveryPaint(muscles) {
      if (!window._frontImg || !window._backImg) return;
      const byKey = {};
      (muscles || []).forEach((m) => { byKey[m.key] = m; });

      if (frontTex) frontTex.dispose();
      if (backTex) backTex.dispose();
      frontTex = makeTintedTexture(window._frontImg, FRONT_REGIONS, byKey, focusKey);
      backTex = makeTintedTexture(window._backImg, BACK_REGIONS, byKey, focusKey);
      if (frontMat) {
        frontMat.map = frontTex;
        frontMat.needsUpdate = true;
      }
      if (backMat) {
        backMat.map = backTex;
        backMat.needsUpdate = true;
      }
    }

    async function buildFigure() {
      const [frontImg, backImg] = await Promise.all([
        loadImage("/static/body-map-previews/anatomical-front.png"),
        loadImage("/static/body-map-previews/anatomical-back.png"),
      ]);
      window._frontImg = frontImg;
      window._backImg = backImg;

      const aspect = (frontImg.naturalWidth || 3) / (frontImg.naturalHeight || 4);
      const height = 2.2;
      const width = height * aspect;

      frontTex = makeTintedTexture(frontImg, FRONT_REGIONS, {}, null);
      backTex = makeTintedTexture(backImg, BACK_REGIONS, {}, null);

      frontMat = new THREE.MeshStandardMaterial({
        map: frontTex,
        transparent: true,
        roughness: 0.55,
        metalness: 0.05,
        side: THREE.FrontSide,
      });
      backMat = new THREE.MeshStandardMaterial({
        map: backTex,
        transparent: true,
        roughness: 0.55,
        metalness: 0.05,
        side: THREE.FrontSide,
      });

      const geo = new THREE.PlaneGeometry(width, height);
      const frontMesh = new THREE.Mesh(geo, frontMat);
      frontMesh.position.z = 0.04;
      const backMesh = new THREE.Mesh(geo, backMat);
      backMesh.rotation.y = Math.PI;
      backMesh.position.z = -0.04;

      // Slight depth card so rotation feels solid
      const core = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.22, height * 0.7, 0.07),
        new THREE.MeshStandardMaterial({ color: 0x1a2330, roughness: 0.8, transparent: true, opacity: 0.35 })
      );
      core.position.y = -0.05;

      mannequin.add(core);
      mannequin.add(frontMesh);
      mannequin.add(backMesh);
      mannequin.position.y = -0.05;
    }

    function renderMuscleList(muscles, focused) {
      const list = $("#muscle-panel-list");
      list.innerHTML = (muscles || []).map((m) => {
        const cls = zoneClass(m.zone);
        const hit = focused && m.key === focused ? "is-hit" : "";
        return `<li class="${hit}" data-key="${m.key}">
          <span>${m.name}</span>
          <span>
            <span class="mp-rate ${cls}">${m.rate}%</span>
            <span class="mp-time">${m.remaining_label || "—"}</span>
          </span>
        </li>`;
      }).join("") || "<li>No muscle data yet — import Jefit to populate</li>";

      list.querySelectorAll("li[data-key]").forEach((li) => {
        li.addEventListener("click", () => {
          focusKey = li.dataset.key;
          applyLive();
        });
      });
    }

    function applyLive() {
      if (!muscleData.length) return;
      const live = muscleData.map((m) => liveMuscleSnapshot(m, Date.now()));
      applyRecoveryPaint(live);
      renderMuscleList(live, focusKey);
    }

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    stage.addEventListener("pointerdown", (e) => {
      dragging = true;
      moved = 0;
      lastX = e.clientX;
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      lastX = e.clientX;
      moved += Math.abs(dx);
      rotY += dx * 0.012;
    });
    stage.addEventListener("pointerup", () => { dragging = false; });
    stage.addEventListener("pointercancel", () => { dragging = false; });

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      mannequin.rotation.y = rotY;
      stars.rotation.y = t * 0.008;
      ring.material.opacity = 0.32 + Math.sin(t * 1.3) * 0.1;
      renderer.render(scene, camera);
    }

    async function loadRecovery() {
      const res = await fetch("/api/muscle-recovery");
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      muscleData = data.muscles || [];
      const speed = data.modifiers && data.modifiers.speed_multiplier;
      if (speed) {
        $("#muscle-panel-sub").textContent = `Repair speed ${Number(speed).toFixed(2)}× · Jefit`;
      }
      applyLive();
      if (liveTimer) clearInterval(liveTimer);
      liveTimer = setInterval(applyLive, 1000);
    }

    addEventListener("resize", resize);

    (async () => {
      resize();
      try {
        await buildFigure();
        await loadRecovery();
      } catch (err) {
        console.error(err);
        $("#muscle-panel-sub").textContent = "Could not load mannequin / recovery data";
      }
      $("#loading").classList.add("hide");
      animate();
    })();
  </script>
</body>
</html>
